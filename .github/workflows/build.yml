name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: koe-linux-x64
          - os: macos-latest
            artifact: koe-macos-arm64
          - os: windows-latest
            artifact: koe-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os != 'Windows'
        run: |
          make test
          make
          mv koe ${{ matrix.artifact }}

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /utf-8 /std:clatest /D_CRT_SECURE_NO_WARNINGS /Fe:config_test.exe config_test.c config.c || exit /b 1
          config_test.exe || exit /b 1
          cl /nologo /O2 /W3 /utf-8 /std:clatest /D_CRT_SECURE_NO_WARNINGS /Fe:koe.exe koe.c config.c || exit /b 1
          mt.exe -nologo -manifest koe.manifest -outputresource:koe.exe;#1 || exit /b 1
          move koe.exe ${{ matrix.artifact }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
